version = "5.0"
name = "Fabricator"
description = "Generics-first Go test data factory library."
gitignore = true
gitignore_exclude = []
default_layers = ["plugins"]

presets = ["claude", "codex", "opencode", "pi"]

builtins = ["go", "security", "git-workflow", "code-quality", "testing", "default-commands"]

[[mcp_servers]]
name = "ai-rulez"
description = "Expose generation and enforcement to MCP-aware tools."
command = "ai-rulez"
args = ["mcp"]

[mcp]
self_server_command = ["ai-rulez", "mcp"]

[lock]
include_outputs = false
