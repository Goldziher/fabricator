version = "4.0"
name = "Fabricator"
description = "Generics-first Go test data factory library."
gitignore = true

presets = ["claude", "codex"]

builtins = ["go", "security", "git-workflow", "code-quality", "testing", "default-commands"]

[[mcp_servers]]
name = "ai-rulez"
description = "Expose generation and enforcement to MCP-aware tools."
command = "npx"
args = ["-y", "ai-rulez@latest", "mcp"]

[[marketplaces]]
name = "basemind"
source = "Goldziher/basemind"
type = "github"

[[plugins]]
marketplace = "basemind"
name = "basemind"
scope = "project"
enabled = true
