version: "3"

tasks:
  setup:
    desc: Set up the development environment
    cmds:
      - go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
      - go install golang.org/x/vuln/cmd/govulncheck@latest
      - brew list prek >/dev/null 2>&1 || brew install prek
      - prek --version | grep -q '0.4.3' || { echo 'prek 0.4.3 is required; run brew upgrade prek'; exit 1; }
      - prek install
      - prek install --hook-type commit-msg
      - go mod download

  default:
    desc: Show available tasks
    cmds:
      - task --list

  update:
    desc: Update dependencies and pre-commit hooks
    cmds:
      - prek autoupdate
      - go get -u ./...
      - go mod tidy

  test:
    desc: Run tests
    cmds:
      - go test ./...

  test:race:
    desc: Run tests with the race detector
    cmds:
      - go test -race ./...

  lint:
    desc: Run all pre-commit hooks
    cmds:
      - prek run --all-files

  check:
    desc: Run Go checks
    cmds:
      - go vet ./...
      - golangci-lint run --timeout=5m
      - govulncheck ./...
      - npx -y ai-rulez@latest validate

  format:
    desc: Format Go code
    cmds:
      - go fmt ./...

  generate:
    desc: Generate ai-rulez configuration files
    cmds:
      - npx -y ai-rulez@latest generate
