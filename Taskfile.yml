version: "3"

tasks:
  setup:
    desc: Set up the development environment
    cmds:
      - go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2
      - go install golang.org/x/vuln/cmd/govulncheck@latest
      - task: governance:hooks
      - go mod download

  default:
    desc: Show available tasks
    cmds:
      - task --list

  update:
    desc: Update dependencies, git hooks, and GitHub Actions
    cmds:
      - poly hooks update
      - gau --recursive --update .
      - go get -u ./...
      - go mod tidy

  test:
    desc: Run tests
    cmds:
      - go test ./...

  test:race:
    desc: Run tests with the race detector
    cmds:
      - go test -race ./...

  lint:
    desc: Lint and format-check every file with poly
    cmds:
      - poly lint .
      - poly fmt --check .

  check:
    desc: Run Go checks
    cmds:
      - go vet ./...
      - golangci-lint run --timeout=5m
      - govulncheck ./...
      - ai-rulez validate

  format:
    desc: Format Go code
    cmds:
      - go fmt ./...

  generate:
    desc: Generate ai-rulez configuration files
    cmds:
      - ai-rulez generate

  governance:generate:
    desc: Generate native AI governance outputs
    cmds:
      - ai-rulez generate --no-local --strict-config

  governance:check:
    desc: Validate native AI governance and freshness
    cmds:
      - ai-rulez migrate okf --check
      - ai-rulez validate --strict --no-local
      - ai-rulez lock --check
      - ai-rulez generate --check --no-local --strict-config

  governance:hooks:
    desc: Provision pinned native governance hooks
    cmds:
      - >-
        python3 -c 'from pathlib import Path;
        p = Path("poly.local.toml");
        p.exists() or p.write_text("[hook_preferences]\nchannels = [\"system\"]\n")'
      - poly hooks update
      - poly hooks install
