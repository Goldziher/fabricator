# Generated by scripts/migrate_to_poly.py from .pre-commit-config.yaml + tool configs. Review before committing.

[defaults]
line_length = 120
line_ending = "lf"
final_newline = true
trim_trailing_whitespace = true

[discovery]
exclude = [
    "**/*.lock",
    "**/*.svg",
    "**/Cargo.lock",
    "**/go.sum",
    "**/package-lock.json",
    "**/pnpm-lock.yaml",
    "**/uv.lock",
    "build/**",
    "dist/**",
    "node_modules/**",
    "vendor/**",
]

[hooks]
stages = ["pre-commit"]

[hooks.builtin]
polylint = { exclude = [
    "**/*.lock",
    "**/*.svg",
    "**/Cargo.lock",
    "**/go.sum",
    "**/package-lock.json",
    "**/pnpm-lock.yaml",
    "**/uv.lock",
    "build/**",
    "dist/**",
    "node_modules/**",
    "vendor/**",
] }
polyfmt = { exclude = [
    "**/*.lock",
    "**/*.svg",
    "**/Cargo.lock",
    "**/go.sum",
    "**/package-lock.json",
    "**/pnpm-lock.yaml",
    "**/uv.lock",
    "build/**",
    "dist/**",
    "node_modules/**",
    "vendor/**",
] }
commit = { stages = ["commit-msg"] }
file_safety = { exclude = [
    "**/*.lock",
    "**/*.svg",
    "**/Cargo.lock",
    "**/go.sum",
    "**/package-lock.json",
    "**/pnpm-lock.yaml",
    "**/uv.lock",
    "build/**",
    "dist/**",
    "node_modules/**",
    "vendor/**",
] }

# --- catalog tools (standalone binaries, PATH-probed) ---
[tools.golangci-lint]
enabled = true
# NOTE: env + per-module cwd (e.g. packages/go) not yet supported by [tools.*].

[tools.shfmt]
enabled = true

[tools.shellcheck]
enabled = true

[tools.actionlint]
enabled = true

# --- dropped / unmapped hooks (for the record) ---
# dropped (toolchain) — stays as standalone CI job: govulncheck
