[defaults]
line_length = 120
line_ending = "lf"
final_newline = true
trim_trailing_whitespace = true

[discovery]
exclude = ["**/*.lock", "**/go.sum"]

[hooks]
stages = ["pre-commit"]

[hooks.builtin]
commit = { stages = ["commit-msg"] }
file_safety = { exclude = ["**/*.lock", "**/go.sum"] }
lint = { exclude = ["**/*.lock", "**/go.sum"] }
fmt = { exclude = ["**/*.lock", "**/go.sum"] }

[lint.markdown.rumdl]
disable = ["MD033"]

[fmt.markdown.rumdl]
disable = ["MD033"]

[tools.golangci-lint]
enabled = true

[tools.actionlint]
enabled = true

[lint.uncomment]
enabled = true
remove_todos = false
remove_fixme = false
remove_docs = false
use_default_ignores = true
preserve_patterns = ["SAFETY", "HACK", "WORKAROUND", "NOTE", "Copyright", "License", "SPDX", "MIT"]

[[hooks.sources]]
id = "ai-rulez"
git = "https://github.com/Goldziher/ai-rulez.git"
revision = "v4.9.3"
hooks = ["ai-rulez-validate"]
