name: ci

on:
  pull_request:
    branches:
      - "**"
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    uses: xberg-io/actions/.github/workflows/reusable-validate.yml@v1

  toolchain:
    name: Toolchain baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: xberg-io/actions/check-toolchain@v1

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: xberg-io/actions/setup-mise@v1
        with:
          install-args: go
      - name: Run tests
        run: mise run test -- -coverprofile=coverage.out
      - name: Run race tests
        run: mise run test:race
      - name: Archive coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.out

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: xberg-io/actions/setup-mise@v1
        with:
          install-args: go
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          # Keep in step with aqua:golangci/golangci-lint in mise.toml. ~keep
          version: v2.15.0

  maintenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: xberg-io/actions/setup-mise@v1
        with:
          install-args: go node go:golang.org/x/vuln/cmd/govulncheck
      - name: Run go vet
        run: go vet ./...
      - name: Run govulncheck
        run: govulncheck ./...
      - name: Validate ai-rulez
        run: npx -y ai-rulez@latest validate

  analyze:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: xberg-io/actions/setup-mise@v1
        with:
          install-args: go
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.39.1
        with:
          languages: go
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4.39.1
